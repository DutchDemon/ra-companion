name: Apply final v0.7.1 patch

on:
  push:
    branches: [feature/v0.7.1-ui-context-cleanup]
    paths:
      - '.github/workflows/apply-v071-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.1-ui-context-cleanup
          fetch-depth: 0

      - name: Apply final isolated patch
        run: python scripts/apply-v071-final.py

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-v071-final.py
          rm .github/workflows/apply-v071-final.yml

      - name: Commit only intended files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/AppPages.tsx app/src/main.tsx app/src/styles.css app/src/profiles/faronNextStep.ts app/src/__tests__/v071.ui-context-cleanup.test.ts scripts/test-live-achievement-counters.cjs
          git add -u -- scripts/apply-v071-final.py .github/workflows/apply-v071-final.yml
          git diff --cached --check
          git commit -m 'v0.7.1: clean live UI and restore Faron next step'
          git push origin HEAD:feature/v0.7.1-ui-context-cleanup
