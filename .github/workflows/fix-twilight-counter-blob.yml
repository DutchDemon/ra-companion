name: Fix Twilight Counter Blob Encoding

on:
  push:
    branches: [feature/v0.7.0-live-achievement-counters]
    paths:
      - '.github/workflows/fix-twilight-counter-blob.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-live-achievement-counters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact CRLF-preserving blob from main
        shell: bash
        run: |
          git show origin/main:app/src/profiles/twilightPrincessState.ts > "$RUNNER_TEMP/tp-main.ts"
          python - <<'PY'
          import os
          from pathlib import Path
          src = Path(os.environ['RUNNER_TEMP']) / 'tp-main.ts'
          out = Path(os.environ['RUNNER_TEMP']) / 'tp-new.ts'
          data = src.read_bytes()
          old = b"source: 'ram' | 'ra';"
          new = b"source: 'rcheevos' | 'ram' | 'ra';"
          if data.count(old) != 1:
              raise SystemExit(f'expected exactly one progress source union, got {data.count(old)}')
          data = data.replace(old, new, 1)
          if b'\r\n' not in data:
              raise SystemExit('expected original CRLF blob')
          out.write_bytes(data)
          PY
          BLOB=$(git hash-object -w --no-filters "$RUNNER_TEMP/tp-new.ts")
          git update-index --cacheinfo 100644,$BLOB,app/src/profiles/twilightPrincessState.ts
      - name: Commit exact blob only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.whitespace cr-at-eol
          rm .github/workflows/fix-twilight-counter-blob.yml
          git add -u .github/workflows/fix-twilight-counter-blob.yml
          git diff --cached --check
          git diff --cached --numstat -- app/src/profiles/twilightPrincessState.ts
          git commit -m 'chore: preserve Twilight state CRLF blob'
          git push origin HEAD:feature/v0.7.0-live-achievement-counters
