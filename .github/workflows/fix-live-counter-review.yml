name: Fix Live Counter Review

on:
  push:
    branches: [feature/v0.7.0-live-achievement-counters]
    paths:
      - '.github/workflows/fix-live-counter-review.yml'
      - 'scripts/fix-live-counter-review.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-live-achievement-counters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-live-counter-review.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.whitespace cr-at-eol
          git diff --check
          git add app/src/profiles/twilightPrincessState.ts app/src/styles.css
          git add -u .github/workflows/fix-live-counter-review.yml scripts/fix-live-counter-review.py
          git diff --cached --check
          git commit -m 'fix: align live counter types and compact layout'
          git push origin HEAD:feature/v0.7.0-live-achievement-counters
