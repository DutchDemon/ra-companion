name: v0.7 Canonical Source Promotion

on:
  workflow_dispatch:
  push:
    branches: [refactor/v0.7.0-source-promotion]
    paths:
      - '.github/workflows/v070-source-promotion.yml'

permissions:
  contents: write

concurrency:
  group: v070-source-promotion-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SOURCE_SHA256: 890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a
  CANONICAL_ZIP: canonical-source-v0.6.4.zip

jobs:
  prepare-transformed-source:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      canonical_sha256: ${{ steps.freeze.outputs.canonical_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.6.4 source
        shell: pwsh
        run: |
          if (Test-Path 'app') { Remove-Item 'app' -Recurse -Force }
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          if ($parts.Count -lt 1) { throw 'No source chunks found.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'ra-companion-source.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:BASE_SOURCE_SHA256) { throw "Source SHA256 mismatch: $actual" }
          Expand-Archive $archive -DestinationPath app -Force

      - name: Apply all shipping transforms through v0.6.4
        shell: pwsh
        run: |
          Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
          Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
          & 'build-overrides/apply-v0.4.5.ps1'
          & 'build-overrides/apply-v0.4.6.ps1'
          & 'build-overrides/apply-v0.4.7.ps1'
          & 'build-overrides/apply-v0.4.8b.ps1'
          & 'build-overrides/apply-v0.5.0.ps1'
          & 'build-overrides/apply-v0.5.1.ps1'
          & 'build-overrides/apply-v0.5.2.ps1'
          & 'build-overrides/apply-v0.5.3.ps1'
          & 'build-overrides/apply-v0.5.4.ps1'
          & 'build-overrides/apply-v0.5.5.ps1'
          & 'build-overrides/apply-v0.5.6.ps1'
          & 'build-overrides/apply-v0.5.7.ps1'
          & 'build-overrides/apply-v0.5.8.ps1'
          & 'hotfixes/apply-v0.5.9.ps1'
          & 'build-overrides/apply-v0.6.0.ps1'
          & 'build-overrides/apply-v0.6.1.ps1'
          & 'build-overrides/apply-v0.6.2.ps1'
          & 'build-overrides/apply-v0.6.3.ps1'
          & 'build-overrides/apply-v0.6.4.ps1'
          $pkg = Get-Content 'app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.6.4') { throw "Expected app version 0.6.4, got $($pkg.version)" }
          if ($pkg.build.win.icon -ne 'electron/ra-icon.ico') { throw 'Windows icon config is missing.' }
          if (-not (Test-Path 'app/electron/ra-icon.ico')) { throw 'Windows ICO asset is missing.' }

      - name: Freeze exact canonical source before dependency install
        id: freeze
        shell: pwsh
        run: |
          if (Test-Path $env:CANONICAL_ZIP) { Remove-Item $env:CANONICAL_ZIP -Force }
          & tar.exe -a -c -f $env:CANONICAL_ZIP app
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          $sha = (Get-FileHash $env:CANONICAL_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          "canonical_sha256=$sha" >> $env:GITHUB_OUTPUT
          "Canonical source SHA256: $sha"

      - name: Upload frozen canonical source
        uses: actions/upload-artifact@v4
        with:
          name: v070-canonical-source
          if-no-files-found: error
          path: ${{ env.CANONICAL_ZIP }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Strict v0.6.4 parity checks
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/main.cjs syntax check failed.' }
          node --check electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/preload.cjs syntax check failed.' }
          $required = @(
            'src/__tests__/v059.ra-authoritative-progress.test.ts',
            'src/__tests__/v060.live-companion.test.ts',
            'src/__tests__/v061.achievement-library.test.ts',
            'src/__tests__/v063.branding.test.ts',
            'src/__tests__/v064.overlay-stability.test.ts'
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Required regression missing: $file" } }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = baseProgress;' -Quiet)) { throw 'Official RA progress is no longer authoritative.' }
          if (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = mergeRecentHardcoreUnlocks(baseProgress, recent, gameId);' -Quiet) { throw 'Recent history is overriding official RA progress.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "achievement-library.json" -Quiet)) { throw 'Persistent achievement library is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "app.setAppUserModelId('com.dutchdemon.racompanion')" -Quiet)) { throw 'Windows AppUserModelID is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'mainWindow.setAppDetails({' -Quiet)) { throw 'Taskbar metadata is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'mainWindow.setIcon(appIconPath)' -Quiet)) { throw 'Runtime main-window icon is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'skipTaskbar: true' -Quiet)) { throw 'Overlay taskbar exclusion is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'resizable: false' -Quiet)) { throw 'Overlay native resize frame is enabled.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'thickFrame: false' -Quiet)) { throw 'Overlay native thick frame is enabled.' }
          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Production build failed with exit code $LASTEXITCODE." }

      - name: Build transformed-source NSIS installer
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE." }

      - name: Verify packaged icon and scan with Defender
        shell: pwsh
        run: |
          $appExe = Get-Item 'app/release/win-unpacked/RA Companion.exe' -ErrorAction Stop
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($appExe.FullName)
          if (-not $icon) { throw 'Could not extract icon from packaged executable.' }
          $bitmap = $icon.ToBitmap()
          try {
            $iconOut = Join-Path (Resolve-Path 'app/release') 'exe-icon.png'
            $bitmap.Save($iconOut, [System.Drawing.Imaging.ImageFormat]::Png)
            if ((Get-Item $iconOut).Length -lt 500) { throw 'Extracted executable icon is unexpectedly small.' }
          } finally {
            $bitmap.Dispose(); $icon.Dispose()
          }
          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq 'RA Companion Setup 0.6.4.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          $report = 'app/release/defender-scan.txt'
          "Target: $($installer.FullName)" | Set-Content $report
          $status = Get-MpComputerStatus -ErrorAction Stop
          "AntivirusEnabled: $($status.AntivirusEnabled)" | Add-Content $report
          "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)" | Add-Content $report
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { ($_.Resources -join ';') -like "*$($installer.Name)*" })
            if ($hits.Count -gt 0) { throw 'Microsoft Defender detected the transformed-source installer.' }
            'RESULT: NO DETECTION' | Add-Content $report
          } else { 'RESULT: DEFENDER NOT ENABLED ON RUNNER' | Add-Content $report }
          Get-Content $report

      - name: Upload transformed-source Windows build
        uses: actions/upload-artifact@v4
        with:
          name: v070-transformed-windows
          if-no-files-found: error
          path: |
            app/release/RA Companion Setup 0.6.4.exe
            app/release/defender-scan.txt
            app/release/exe-icon.png

  scan-transformed-clamav:
    needs: prepare-transformed-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v070-transformed-windows
          path: artifact
      - name: ClamAV transformed-source installer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo pkill -x freshclam || true
          sudo freshclam
          INSTALLER=$(find artifact -type f -name 'RA Companion Setup 0.6.4.exe' -print -quit)
          test -n "$INSTALLER"
          clamscan "$INSTALLER" | tee artifact/clamav-scan.txt
          test ${PIPESTATUS[0]} -eq 0

  verify-direct-source:
    needs: prepare-transformed-source
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v070-canonical-source
          path: canonical
      - name: Unpack frozen canonical source
        shell: pwsh
        run: |
          Expand-Archive 'canonical/canonical-source-v0.6.4.zip' -DestinationPath . -Force
          if (-not (Test-Path 'app/package.json')) { throw 'Canonical app source did not unpack correctly.' }
          if (Test-Path 'build-source') { throw 'Historical repository source unexpectedly present in direct-source workspace.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install dependencies from canonical source
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Direct-source regressions and production build
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/main.cjs syntax check failed.' }
          node --check electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/preload.cjs syntax check failed.' }
          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.6.4') { throw "Canonical version drifted: $($pkg.version)" }
          if ($pkg.build.win.icon -ne 'electron/ra-icon.ico') { throw 'Canonical Windows icon config drifted.' }
          if (-not (Test-Path 'electron/ra-icon.ico')) { throw 'Canonical Windows icon asset is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = baseProgress;' -Quiet)) { throw 'Official RA progress is no longer authoritative.' }
          if (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = mergeRecentHardcoreUnlocks(baseProgress, recent, gameId);' -Quiet) { throw 'Recent history is overriding official RA progress.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "achievement-library.json" -Quiet)) { throw 'Persistent achievement library is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "app.setAppUserModelId('com.dutchdemon.racompanion')" -Quiet)) { throw 'Windows AppUserModelID is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'mainWindow.setAppDetails({' -Quiet)) { throw 'Taskbar metadata is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'mainWindow.setIcon(appIconPath)' -Quiet)) { throw 'Runtime main-window icon is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'skipTaskbar: true' -Quiet)) { throw 'Overlay taskbar exclusion is missing.' }
          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Production build failed with exit code $LASTEXITCODE." }
      - name: Build direct-source NSIS installer
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE." }
      - name: Verify direct packaged icon and Defender scan
        shell: pwsh
        run: |
          $appExe = Get-Item 'app/release/win-unpacked/RA Companion.exe' -ErrorAction Stop
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($appExe.FullName)
          if (-not $icon) { throw 'Could not extract direct-source executable icon.' }
          $bitmap = $icon.ToBitmap()
          try {
            $iconOut = Join-Path (Resolve-Path 'app/release') 'exe-icon.png'
            $bitmap.Save($iconOut, [System.Drawing.Imaging.ImageFormat]::Png)
            if ((Get-Item $iconOut).Length -lt 500) { throw 'Direct-source executable icon is unexpectedly small.' }
          } finally {
            $bitmap.Dispose(); $icon.Dispose()
          }
          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq 'RA Companion Setup 0.6.4.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'Direct-source NSIS installer was not generated.' }
          $report = 'app/release/defender-scan.txt'
          "Target: $($installer.FullName)" | Set-Content $report
          $status = Get-MpComputerStatus -ErrorAction Stop
          "AntivirusEnabled: $($status.AntivirusEnabled)" | Add-Content $report
          "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)" | Add-Content $report
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { ($_.Resources -join ';') -like "*$($installer.Name)*" })
            if ($hits.Count -gt 0) { throw 'Microsoft Defender detected the direct-source installer.' }
            'RESULT: NO DETECTION' | Add-Content $report
          } else { 'RESULT: DEFENDER NOT ENABLED ON RUNNER' | Add-Content $report }
          Get-Content $report
      - name: Upload direct-source Windows build
        uses: actions/upload-artifact@v4
        with:
          name: v070-direct-windows
          if-no-files-found: error
          path: |
            app/release/RA Companion Setup 0.6.4.exe
            app/release/defender-scan.txt
            app/release/exe-icon.png

  scan-direct-clamav:
    needs: verify-direct-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v070-direct-windows
          path: artifact
      - name: ClamAV direct-source installer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo pkill -x freshclam || true
          sudo freshclam
          INSTALLER=$(find artifact -type f -name 'RA Companion Setup 0.6.4.exe' -print -quit)
          test -n "$INSTALLER"
          clamscan "$INSTALLER" | tee artifact/clamav-scan.txt
          test ${PIPESTATUS[0]} -eq 0

  promote-canonical-source:
    needs: [prepare-transformed-source, scan-transformed-clamav, verify-direct-source, scan-direct-clamav]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v0.7.0-source-promotion
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v070-canonical-source
          path: canonical
      - name: Promote verified source tree
        shell: bash
        env:
          CANONICAL_SHA256: ${{ needs.prepare-transformed-source.outputs.canonical_sha256 }}
        run: |
          set -euo pipefail
          rm -rf app
          unzip -q canonical/canonical-source-v0.6.4.zip
          test -f app/package.json
          test ! -d app/node_modules
          test ! -d app/dist
          test ! -d app/release
          cat > docs/V0.7-SOURCE-PROMOTION-RESULT.md <<EOF
          # v0.7 Canonical Source Promotion Result

          Source baseline: v0.6.4

          Legacy archive SHA256: \`$BASE_SOURCE_SHA256\`

          Frozen canonical source ZIP SHA256: \`$CANONICAL_SHA256\`

          Promotion workflow run: \`$GITHUB_RUN_ID\`

          Both the historical transformed-source build and the clean direct-source build passed the regression, production build, NSIS packaging, Windows icon, Microsoft Defender and ClamAV gates before this source tree was committed.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs/V0.7-SOURCE-PROMOTION-RESULT.md
          if git diff --cached --quiet; then
            echo 'Canonical source already matches the verified source.'
            exit 0
          fi
          git commit -m 'refactor: promote v0.6.4 canonical source'
          git push origin HEAD:refactor/v0.7.0-source-promotion
