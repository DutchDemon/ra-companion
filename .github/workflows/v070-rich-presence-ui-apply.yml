name: Apply v0.7 Rich Presence UI

on:
  push:
    branches:
      - feature/v0.7.0-rich-presence-ui
    paths:
      - scripts/apply-rich-presence-ui.py
      - .github/workflows/v070-rich-presence-ui-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-rich-presence-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/apply-rich-presence-ui.py
      - name: Commit intended product files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config core.whitespace cr-at-eol
          git add app/electron/main.cjs app/src/main.tsx app/src/AppPages.tsx app/src/global.d.ts app/src/styles.css scripts/test-rich-presence-ui-contract.cjs
          git add -u .github/workflows/v070-rich-presence-ui-apply.yml scripts/apply-rich-presence-ui.py
          git diff --cached --check
          git commit -m "feat: surface official rcheevos Rich Presence"
          git push origin HEAD:feature/v0.7.0-rich-presence-ui
