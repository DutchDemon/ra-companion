name: Fix TP Story Route EOL

on:
  push:
    branches: [feature/tp-full-story-route]
    paths:
      - '.github/workflows/fix-tp-story-route-eol.yml'
      - 'scripts/fix-tp-story-route-eol.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tp-full-story-route
          fetch-depth: 0
      - name: Restore historical CRLF source from main
        run: |
          git fetch origin main
          git checkout origin/main -- app/src/profiles/twilightPrincess.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply story-route patch byte-safely
        run: python scripts/fix-tp-story-route-eol.py
      - name: Remove temporary repair machinery
        run: |
          rm -f scripts/fix-tp-story-route-eol.py
          rm -f .github/workflows/fix-tp-story-route-eol.yml
      - name: Verify clean diff
        run: |
          git diff --check
          git status --short
      - name: Commit corrected product file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/profiles/twilightPrincess.ts scripts/fix-tp-story-route-eol.py .github/workflows/fix-tp-story-route-eol.yml
          git commit -m 'fix: preserve Twilight Princess profile line endings'
          git push origin HEAD:feature/tp-full-story-route
