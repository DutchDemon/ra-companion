name: Inspect v0.6.4 Source

on:
  push:
    branches: [inspect-v0.6.4]
    paths:
      - '.github/workflows/inspect-v064-source.yml'

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified base source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'ra-companion-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a') { throw "Source SHA256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath app -Force

      - name: Apply source overrides through v0.6.3
        shell: pwsh
        run: |
          Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
          Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
          & 'build-overrides/apply-v0.4.5.ps1'
          & 'build-overrides/apply-v0.4.6.ps1'
          & 'build-overrides/apply-v0.4.7.ps1'
          & 'build-overrides/apply-v0.4.8b.ps1'
          & 'build-overrides/apply-v0.5.0.ps1'
          & 'build-overrides/apply-v0.5.1.ps1'
          & 'build-overrides/apply-v0.5.2.ps1'
          & 'build-overrides/apply-v0.5.3.ps1'
          & 'build-overrides/apply-v0.5.4.ps1'
          & 'build-overrides/apply-v0.5.5.ps1'
          & 'build-overrides/apply-v0.5.6.ps1'
          & 'build-overrides/apply-v0.5.7.ps1'
          & 'build-overrides/apply-v0.5.8.ps1'
          & 'hotfixes/apply-v0.5.9.ps1'
          & 'build-overrides/apply-v0.6.0.ps1'
          & 'build-overrides/apply-v0.6.1.ps1'
          & 'build-overrides/apply-v0.6.2.ps1'
          & 'build-overrides/apply-v0.6.3.ps1'

      - name: Copy diagnostic source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diagnostic/electron -Force | Out-Null
          New-Item -ItemType Directory -Path diagnostic/src -Force | Out-Null
          Copy-Item app/electron/main.cjs diagnostic/electron/main.cjs
          Copy-Item app/electron/preload.cjs diagnostic/electron/preload.cjs
          Copy-Item app/src/main.tsx diagnostic/src/main.tsx
          Copy-Item app/src/styles.css diagnostic/src/styles.css
          Copy-Item app/package.json diagnostic/package.json

      - uses: actions/upload-artifact@v4
        with:
          name: v064-source-inspection
          path: diagnostic
          if-no-files-found: error
