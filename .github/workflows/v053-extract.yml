name: Extract v0.5.2 source

on:
  push:
    branches: [v0.5.3-work]
    paths:
      - '.github/workflows/v053-extract.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.5.2 working source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          if ($parts.Count -lt 1) { throw 'No source chunks found.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a') { throw "Unexpected baseline SHA256: $hash" }
          Expand-Archive $zip -DestinationPath app -Force
          Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
          Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
          & 'build-overrides/apply-v0.4.5.ps1'
          & 'build-overrides/apply-v0.4.6.ps1'
          & 'build-overrides/apply-v0.4.7.ps1'
          & 'build-overrides/apply-v0.4.8b.ps1'
          & 'build-overrides/apply-v0.5.0.ps1'
          & 'build-overrides/apply-v0.5.1.ps1'
          & 'build-overrides/apply-v0.5.2.ps1'
          $pkg = Get-Content 'app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.5.2') { throw "Expected 0.5.2, got $($pkg.version)" }

      - name: Collect source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path export -Force | Out-Null
          Copy-Item app/src export/src -Recurse -Force
          Copy-Item app/tools export/tools -Recurse -Force
          Copy-Item app/electron export/electron -Recurse -Force
          Copy-Item app/package.json export/package.json -Force
          if (Test-Path app/package-lock.json) { Copy-Item app/package-lock.json export/package-lock.json -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: v052-working-source
          path: export
          if-no-files-found: error
