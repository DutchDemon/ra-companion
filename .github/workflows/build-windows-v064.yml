name: Build Windows Installer v0.6.4

on:
  workflow_dispatch:
  push:
    branches: [main, release/v0.6.4]
    paths:
      - 'build-overrides/**'
      - 'hotfixes/**'
      - '.github/workflows/build-windows-v064.yml'

permissions:
  contents: write

concurrency:
  group: windows-release-v064-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified base source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          if ($parts.Count -lt 1) { throw 'No source chunks found.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'ra-companion-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a'
          if ($actual -ne $expected) { throw "Source SHA256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath app -Force
          "SOURCE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply source overrides through v0.6.4
        shell: pwsh
        run: |
          Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
          Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
          & 'build-overrides/apply-v0.4.5.ps1'
          & 'build-overrides/apply-v0.4.6.ps1'
          & 'build-overrides/apply-v0.4.7.ps1'
          & 'build-overrides/apply-v0.4.8b.ps1'
          & 'build-overrides/apply-v0.5.0.ps1'
          & 'build-overrides/apply-v0.5.1.ps1'
          & 'build-overrides/apply-v0.5.2.ps1'
          & 'build-overrides/apply-v0.5.3.ps1'
          & 'build-overrides/apply-v0.5.4.ps1'
          & 'build-overrides/apply-v0.5.5.ps1'
          & 'build-overrides/apply-v0.5.6.ps1'
          & 'build-overrides/apply-v0.5.7.ps1'
          & 'build-overrides/apply-v0.5.8.ps1'
          & 'hotfixes/apply-v0.5.9.ps1'
          & 'build-overrides/apply-v0.6.0.ps1'
          & 'build-overrides/apply-v0.6.1.ps1'
          & 'build-overrides/apply-v0.6.2.ps1'
          & 'build-overrides/apply-v0.6.3.ps1'
          & 'build-overrides/apply-v0.6.4.ps1'
          $pkg = Get-Content 'app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.6.4') { throw "Expected app version 0.6.4, got $($pkg.version)" }
          if ($pkg.build.win.icon -ne 'electron/ra-icon.ico') { throw 'Windows icon config is missing.' }
          if (-not (Test-Path 'app/electron/ra-icon.ico')) { throw 'Windows ICO asset is missing.' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Strict sanity checks and regressions
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/main.cjs syntax check failed.' }
          node --check electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/preload.cjs syntax check failed.' }

          if (-not (Test-Path 'src/__tests__/v059.ra-authoritative-progress.test.ts')) { throw 'v0.5.9 authoritative-progress regression is missing.' }
          if (-not (Test-Path 'src/__tests__/v060.live-companion.test.ts')) { throw 'v0.6.0 live-companion regressions are missing.' }
          if (-not (Test-Path 'src/__tests__/v061.achievement-library.test.ts')) { throw 'v0.6.1 achievement-library regressions are missing.' }
          if (-not (Test-Path 'src/__tests__/v063.branding.test.ts')) { throw 'v0.6.3 branding regressions are missing.' }
          if (-not (Test-Path 'src/__tests__/v064.overlay-stability.test.ts')) { throw 'v0.6.4 overlay regression is missing.' }

          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = baseProgress;' -Quiet)) { throw 'Official RA game progress is no longer authoritative.' }
          if (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = mergeRecentHardcoreUnlocks(baseProgress, recent, gameId);' -Quiet) { throw 'Recent history is overriding official RA progress again.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "achievement-library.json" -Quiet)) { throw 'Persistent achievement library backend is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "ipcMain.handle('library:get'" -Quiet)) { throw 'Achievement library IPC is missing.' }
          if (Select-String -Path 'src/main.tsx' -SimpleMatch "['missables', '!', 'Missables']" -Quiet) { throw 'Separate Missables navigation returned.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "app.setAppUserModelId('com.dutchdemon.racompanion')" -Quiet)) { throw 'Windows AppUserModelID is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'mainWindow.setAppDetails({' -Quiet)) { throw 'Explicit Windows taskbar details are missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'mainWindow.setIcon(appIconPath)' -Quiet)) { throw 'Explicit main-window icon assignment is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'skipTaskbar: true' -Quiet)) { throw 'Overlay taskbar exclusion is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'resizable: false' -Quiet)) { throw 'Overlay native resize frame is still enabled.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'thickFrame: false' -Quiet)) { throw 'Overlay native thick frame is still enabled.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'width: overlayMoveSession.startBounds.width' -Quiet)) { throw 'Overlay move no longer locks width.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'height: overlayMoveSession.startBounds.height' -Quiet)) { throw 'Overlay move no longer locks height.' }
          if (-not (Select-String -Path 'src/styles.css' -SimpleMatch '/* v0.6.4 overlay charcoal/orange completion */' -Quiet)) { throw 'Complete overlay RA theme is missing.' }
          if (-not (Select-String -Path 'src/styles.css' -SimpleMatch '.context-achievement-copy b { color: #fff; }' -Quiet)) { throw 'Overlay achievement titles are no longer white.' }

          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Production build failed with exit code $LASTEXITCODE." }

      - name: Build NSIS installer
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE." }

      - name: Verify packaged executable icon and generate hashes
        shell: pwsh
        run: |
          $appExe = Get-Item 'app/release/win-unpacked/RA Companion.exe' -ErrorAction Stop
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($appExe.FullName)
          if (-not $icon) { throw 'Could not extract icon from packaged RA Companion.exe.' }
          $bitmap = $icon.ToBitmap()
          try {
            $iconOut = Join-Path (Resolve-Path 'app/release') 'exe-icon.png'
            $bitmap.Save($iconOut, [System.Drawing.Imaging.ImageFormat]::Png)
            if ((Get-Item $iconOut).Length -lt 500) { throw 'Extracted packaged executable icon is unexpectedly small.' }
          } finally {
            $bitmap.Dispose()
            $icon.Dispose()
          }

          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq 'RA Companion Setup 0.6.4.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha512 = (Get-FileHash $installer.FullName -Algorithm SHA512).Hash.ToLowerInvariant()
          @(
            "File: $($installer.Name)",
            "Source baseline SHA256: $env:SOURCE_SHA256",
            "Installer SHA256: $sha256",
            "Installer SHA512: $sha512"
          ) | Set-Content 'app/release/checksums.txt'
          Get-Content 'app/release/checksums.txt'

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $report = 'app/release/defender-scan.txt'
          "Target: $env:INSTALLER_PATH" | Set-Content $report
          $status = Get-MpComputerStatus -ErrorAction Stop
          "AntivirusEnabled: $($status.AntivirusEnabled)" | Add-Content $report
          "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)" | Add-Content $report
          "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)" | Add-Content $report
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $env:INSTALLER_PATH -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { ($_.Resources -join ';') -like "*$($env:INSTALLER_NAME)*" })
            if ($hits.Count -gt 0) {
              "RESULT: DETECTION" | Add-Content $report
              $hits | Format-List * | Out-String | Add-Content $report
              throw 'Microsoft Defender detected the installer.'
            }
            "RESULT: NO DETECTION" | Add-Content $report
          } else {
            "RESULT: DEFENDER NOT ENABLED ON RUNNER" | Add-Content $report
          }
          Get-Content $report

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.6.4-windows
          if-no-files-found: error
          path: |
            app/release/RA Companion Setup 0.6.4.exe
            app/release/*.blockmap
            app/release/latest.yml
            app/release/checksums.txt
            app/release/defender-scan.txt
            app/release/exe-icon.png

  clamav:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.6.4-windows
          path: artifact

      - name: Install and update ClamAV
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo pkill -x freshclam || true
          sudo freshclam
          clamscan --version
          test -n "$(find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print -quit)"

      - name: ClamAV scan
        shell: bash
        run: |
          set -o pipefail
          INSTALLER=$(find artifact -maxdepth 1 -type f -name 'RA Companion Setup 0.6.4.exe' -print -quit)
          test -n "$INSTALLER"
          clamscan "$INSTALLER" | tee artifact/clamav-scan.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload antivirus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.6.4-antivirus
          path: artifact/clamav-scan.txt
          if-no-files-found: warn

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, clamav]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.6.4-windows
          path: release

      - name: Download ClamAV report
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.6.4-antivirus
          path: antivirus

      - name: Prepare and verify updater payload
        shell: bash
        run: |
          test -f 'release/RA Companion Setup 0.6.4.exe'
          test -f 'release/RA Companion Setup 0.6.4.exe.blockmap'
          test -f 'release/latest.yml'
          test -f 'release/checksums.txt'
          test -f 'release/defender-scan.txt'
          test -f 'antivirus/clamav-scan.txt'
          cp 'release/RA Companion Setup 0.6.4.exe' 'release/RA-Companion-Setup-0.6.4.exe'
          cp 'release/RA Companion Setup 0.6.4.exe.blockmap' 'release/RA-Companion-Setup-0.6.4.exe.blockmap'
          EXPECTED_PATH=$(awk '/^path:/ {print $2; exit}' release/latest.yml)
          test "$EXPECTED_PATH" = 'RA-Companion-Setup-0.6.4.exe'
          test -f "release/$EXPECTED_PATH"
          test -f "release/$EXPECTED_PATH.blockmap"

      - name: Publish GitHub Release v0.6.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## RA Companion v0.6.4 — Overlay Stability + Windows Taskbar Fix

          - Prevents hold-to-move on the overlay from changing the overlay size.
          - Disables the conflicting native Windows resize frame while preserving RA Companion's explicit resize handles.
          - Finishes the overlay charcoal/orange RetroAchievements theme while keeping achievement text white/neutral.
          - Keeps the overlay out of the Windows taskbar.
          - Explicitly applies the RA icon and Windows AppUserModelID/taskbar metadata to the main window.
          - Rebuilds the Windows ICO with 16/20/24/32/40/48/64/128/256 px variants.
          - Applies the RA icon to the app, installer and uninstaller resources.
          - Preserves authoritative RA progress and the persistent achievement library.

          The Windows release is published only after strict regressions, production build, packaged-exe icon extraction, Microsoft Defender and ClamAV all pass.
          NOTES

          TAG='v0.6.4'
          REPO='${{ github.repository }}'
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              'release/RA-Companion-Setup-0.6.4.exe' \
              'release/RA-Companion-Setup-0.6.4.exe.blockmap' \
              'release/latest.yml' \
              'release/checksums.txt' \
              'release/defender-scan.txt' \
              'antivirus/clamav-scan.txt' \
              --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title 'RA Companion v0.6.4' --notes-file release-notes.md --latest
          else
            gh release create "$TAG" \
              'release/RA-Companion-Setup-0.6.4.exe' \
              'release/RA-Companion-Setup-0.6.4.exe.blockmap' \
              'release/latest.yml' \
              'release/checksums.txt' \
              'release/defender-scan.txt' \
              'antivirus/clamav-scan.txt' \
              --repo "$REPO" \
              --target main \
              --title 'RA Companion v0.6.4' \
              --notes-file release-notes.md \
              --latest
          fi
