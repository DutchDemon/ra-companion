name: Apply v0.8.1 Overlay Type Fix

on:
  push:
    branches:
      - feature/v0.8.1-settings-epipe-story-next
    paths:
      - '.github/workflows/temp-v081-typefix.yml'
      - 'scripts/fix-v081-overlay.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.8.1-settings-epipe-story-next
      - name: Apply type-safe overlay dedupe
        run: python scripts/fix-v081-overlay.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify typecheck
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main.tsx app/src/__tests__/v081.settings-epipe-story-next.test.ts
          git commit -m 'fix: keep story-next dedupe local to overlay'
          git push origin HEAD:feature/v0.8.1-settings-epipe-story-next
