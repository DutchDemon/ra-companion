name: Build Windows Installer v0.6.3

on:
  workflow_dispatch:
  push:
    branches: [main, release/v0.6.3]
    paths:
      - 'build-overrides/**'
      - 'hotfixes/**'
      - '.github/workflows/build-windows-v063.yml'

permissions:
  contents: write

concurrency:
  group: windows-release-v063-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified base source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          if ($parts.Count -lt 1) { throw 'No source chunks found.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'ra-companion-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a'
          if ($actual -ne $expected) { throw "Source SHA256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath app -Force
          "SOURCE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply source overrides through v0.6.3
        shell: pwsh
        run: |
          Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
          Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
          & 'build-overrides/apply-v0.4.5.ps1'
          & 'build-overrides/apply-v0.4.6.ps1'
          & 'build-overrides/apply-v0.4.7.ps1'
          & 'build-overrides/apply-v0.4.8b.ps1'
          & 'build-overrides/apply-v0.5.0.ps1'
          & 'build-overrides/apply-v0.5.1.ps1'
          & 'build-overrides/apply-v0.5.2.ps1'
          & 'build-overrides/apply-v0.5.3.ps1'
          & 'build-overrides/apply-v0.5.4.ps1'
          & 'build-overrides/apply-v0.5.5.ps1'
          & 'build-overrides/apply-v0.5.6.ps1'
          & 'build-overrides/apply-v0.5.7.ps1'
          & 'build-overrides/apply-v0.5.8.ps1'
          & 'hotfixes/apply-v0.5.9.ps1'
          & 'build-overrides/apply-v0.6.0.ps1'
          & 'build-overrides/apply-v0.6.1.ps1'
          & 'build-overrides/apply-v0.6.2.ps1'
          & 'build-overrides/apply-v0.6.3.ps1'
          $pkg = Get-Content 'app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.6.3') { throw "Expected app version 0.6.3, got $($pkg.version)" }
          if ($pkg.build.win.icon -ne 'electron/ra-icon.ico') { throw 'Multi-resolution Windows icon is not configured.' }
          if (-not (Test-Path 'app/electron/ra-icon.ico')) { throw 'Runtime Windows icon asset is missing.' }
          if (-not (Test-Path 'app/src/assets/ra-icon.png')) { throw 'Sidebar RA logo asset is missing.' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Sanity checks and regressions
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/main.cjs syntax check failed.' }
          node --check electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/preload.cjs syntax check failed.' }

          if (-not (Test-Path 'src/__tests__/v059.ra-authoritative-progress.test.ts')) { throw 'v0.5.9 authoritative-progress regression is missing.' }
          if (-not (Test-Path 'src/__tests__/v060.live-companion.test.ts')) { throw 'v0.6.0 live-companion regressions are missing.' }
          if (-not (Test-Path 'src/__tests__/v061.achievement-library.test.ts')) { throw 'v0.6.1 achievement-library regressions are missing.' }
          if (-not (Test-Path 'src/__tests__/v063.branding.test.ts')) { throw 'v0.6.3 branding regressions are missing.' }

          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = baseProgress;' -Quiet)) { throw 'Official RA game progress is no longer authoritative.' }
          if (Select-String -Path 'electron/main.cjs' -SimpleMatch 'const progress = mergeRecentHardcoreUnlocks(baseProgress, recent, gameId);' -Quiet) { throw 'Recent history is overriding official RA progress again.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "achievement-library.json" -Quiet)) { throw 'Persistent achievement library backend is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "ipcMain.handle('library:get'" -Quiet)) { throw 'Achievement library IPC is missing.' }
          if (-not (Select-String -Path 'electron/preload.cjs' -SimpleMatch 'getAchievementLibrary' -Quiet)) { throw 'Achievement library preload API is missing.' }
          if (Select-String -Path 'src/main.tsx' -SimpleMatch "['missables', '!', 'Missables']" -Quiet) { throw 'Separate Missables navigation returned.' }
          if (Select-String -Path 'src/AppPages.tsx' -SimpleMatch 'export function MissablesPage()' -Quiet) { throw 'Separate Missables page returned.' }
          if (-not (Select-String -Path 'src/AppPages.tsx' -SimpleMatch 'ra-companion-achievement-groups-v1' -Quiet)) { throw 'Collapsible game-group persistence is missing.' }
          if (-not (Select-String -Path 'src/AppPages.tsx' -SimpleMatch 'Saved achievement data remains available offline.' -Quiet)) { throw 'Offline achievement library behavior is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'quitAndInstall(true, true)' -Quiet)) { throw 'Silent updater install call is missing.' }

          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "app.setAppUserModelId('com.dutchdemon.racompanion')" -Quiet)) { throw 'Windows AppUserModelID is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "const appIconPath = path.join(__dirname, 'ra-icon.ico');" -Quiet)) { throw 'Runtime icon path is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'icon: appIconPath' -Quiet)) { throw 'Main BrowserWindow icon is missing.' }
          if (Select-String -Path 'src/main.tsx' -SimpleMatch '<div className="v5-brand-mark">RA</div>' -Quiet) { throw 'Old text-tile brand returned.' }
          if (-not (Select-String -Path 'src/main.tsx' -SimpleMatch 'src={raCompanionLogo}' -Quiet)) { throw 'Official RA logo is not used in the sidebar.' }
          if (-not (Select-String -Path 'src/styles.css' -SimpleMatch '--ra-orange: #f28c28;' -Quiet)) { throw 'RA charcoal/orange theme is missing.' }

          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($pkg.build.win.icon -ne 'electron/ra-icon.ico') { throw 'Windows app icon regressed.' }
          if (-not (Test-Path 'electron/ra-icon.ico')) { throw 'Windows runtime icon file is missing.' }
          if ((Get-Item 'electron/ra-icon.ico').Length -lt 1024) { throw 'Windows runtime icon is unexpectedly small.' }

          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Production build failed with exit code $LASTEXITCODE." }

      - name: Build NSIS installer
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE." }

      - name: Locate installer and generate hashes
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq 'RA Companion Setup 0.6.3.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha512 = (Get-FileHash $installer.FullName -Algorithm SHA512).Hash.ToLowerInvariant()
          @(
            "File: $($installer.Name)",
            "Source baseline SHA256: $env:SOURCE_SHA256",
            "Installer SHA256: $sha256",
            "Installer SHA512: $sha512"
          ) | Set-Content 'app/release/checksums.txt'
          Get-Content 'app/release/checksums.txt'

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $report = 'app/release/defender-scan.txt'
          "Target: $env:INSTALLER_PATH" | Set-Content $report
          $status = Get-MpComputerStatus -ErrorAction Stop
          "AntivirusEnabled: $($status.AntivirusEnabled)" | Add-Content $report
          "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)" | Add-Content $report
          "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)" | Add-Content $report
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $env:INSTALLER_PATH -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { ($_.Resources -join ';') -like "*$($env:INSTALLER_NAME)*" })
            if ($hits.Count -gt 0) {
              "RESULT: DETECTION" | Add-Content $report
              $hits | Format-List * | Out-String | Add-Content $report
              Get-Content $report
              throw 'Microsoft Defender detected the installer.'
            }
            "RESULT: NO DETECTION" | Add-Content $report
          } else {
            "RESULT: DEFENDER NOT ENABLED ON RUNNER" | Add-Content $report
          }
          Get-Content $report

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.6.3-windows
          if-no-files-found: error
          path: |
            app/release/RA Companion Setup 0.6.3.exe
            app/release/*.blockmap
            app/release/latest.yml
            app/release/checksums.txt
            app/release/defender-scan.txt

  clamav:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.6.3-windows
          path: artifact

      - name: Install and update ClamAV
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo pkill -x freshclam || true
          sudo freshclam
          clamscan --version
          test -n "$(find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print -quit)"

      - name: ClamAV scan
        shell: bash
        run: |
          set -o pipefail
          INSTALLER=$(find artifact -maxdepth 1 -type f -name 'RA Companion Setup 0.6.3.exe' -print -quit)
          test -n "$INSTALLER"
          clamscan "$INSTALLER" | tee artifact/clamav-scan.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload antivirus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.6.3-antivirus
          path: artifact/clamav-scan.txt
          if-no-files-found: warn

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, clamav]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.6.3-windows
          path: release

      - name: Download ClamAV report
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.6.3-antivirus
          path: antivirus

      - name: Prepare and verify updater payload
        shell: bash
        run: |
          test -f 'release/RA Companion Setup 0.6.3.exe'
          test -f 'release/RA Companion Setup 0.6.3.exe.blockmap'
          test -f 'release/latest.yml'
          test -f 'release/checksums.txt'
          test -f 'release/defender-scan.txt'
          test -f 'antivirus/clamav-scan.txt'
          cp 'release/RA Companion Setup 0.6.3.exe' 'release/RA-Companion-Setup-0.6.3.exe'
          cp 'release/RA Companion Setup 0.6.3.exe.blockmap' 'release/RA-Companion-Setup-0.6.3.exe.blockmap'
          EXPECTED_PATH=$(awk '/^path:/ {print $2; exit}' release/latest.yml)
          test "$EXPECTED_PATH" = 'RA-Companion-Setup-0.6.3.exe'
          test -f "release/$EXPECTED_PATH"
          test -f "release/$EXPECTED_PATH.blockmap"

      - name: Publish GitHub Release v0.6.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## RA Companion v0.6.3 — RetroAchievements Theme + Windows Icon Fix

          - Applies the official RetroAchievements logo to the sidebar brand.
          - Uses a dark charcoal interface with RetroAchievements orange accents while keeping achievement titles and copy white/neutral.
          - Adds a proper multi-resolution Windows icon and assigns it directly to the running BrowserWindow.
          - Adds a stable Windows AppUserModelID so the taskbar uses the RA Companion identity instead of Electron.
          - Updates the intentionally changed Faron Vessel regression expectations from v0.6.0.
          - Makes regression-test and production-build failures hard CI failures instead of allowing a later command to mask them.
          - Preserves the persistent multi-game achievement library from v0.6.1.

          The Windows release is published only after regressions, production build, Microsoft Defender and ClamAV all pass.
          NOTES

          TAG='v0.6.3'
          REPO='${{ github.repository }}'
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              'release/RA-Companion-Setup-0.6.3.exe' \
              'release/RA-Companion-Setup-0.6.3.exe.blockmap' \
              'release/latest.yml' \
              'release/checksums.txt' \
              'release/defender-scan.txt' \
              'antivirus/clamav-scan.txt' \
              --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title 'RA Companion v0.6.3' --notes-file release-notes.md --latest
          else
            gh release create "$TAG" \
              'release/RA-Companion-Setup-0.6.3.exe' \
              'release/RA-Companion-Setup-0.6.3.exe.blockmap' \
              'release/latest.yml' \
              'release/checksums.txt' \
              'release/defender-scan.txt' \
              'antivirus/clamav-scan.txt' \
              --repo "$REPO" \
              --target main \
              --title 'RA Companion v0.6.3' \
              --notes-file release-notes.md \
              --latest
          fi
