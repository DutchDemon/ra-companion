name: Wire TP Story Context

on:
  push:
    branches: [feature/tp-full-story-route]
    paths:
      - '.github/workflows/wire-tp-story-context.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tp-full-story-route
          fetch-depth: 0
      - name: Wire story-aware context into TP profile
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/profiles/registry.ts')
          raw = p.read_bytes()
          text = raw.decode('utf-8')
          nl = '\r\n' if '\r\n' in text else '\n'
          def eol(value): return value.replace('\n', nl)
          changes = [
            ("import {\n  buildTwilightContext,\n", "import {\n"),
            ("} from './twilightPrincess';\nimport { getTwilightMissableGuide } from './twilightPrincessGuide';", "} from './twilightPrincess';\nimport { buildTwilightStoryAwareContext } from './twilightPrincessStoryContext';\nimport { getTwilightMissableGuide } from './twilightPrincessGuide';"),
            ("  buildContext: buildTwilightContext,", "  buildContext: buildTwilightStoryAwareContext,"),
          ]
          for old, new in changes:
            old, new = eol(old), eol(new)
            if text.count(old) != 1:
              raise SystemExit(f'Expected one match for {old!r}, got {text.count(old)}')
            text = text.replace(old, new)
          p.write_bytes(text.encode('utf-8'))
      - name: Remove temporary workflow
        run: rm -f .github/workflows/wire-tp-story-context.yml
      - name: Verify diff
        run: |
          git diff --check
          git status --short
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/profiles/registry.ts .github/workflows/wire-tp-story-context.yml
          git commit -m 'feat: use walkthrough-aware Twilight Princess context'
          git push origin HEAD:feature/tp-full-story-route
