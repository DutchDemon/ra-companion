name: Validate v0.5.1

on:
  push:
    branches: [v0.5.1-work]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified baseline
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a') { throw "Unexpected baseline SHA256: $hash" }
          Expand-Archive $zip -DestinationPath app -Force

      - name: Apply source overrides through v0.5.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          try {
            Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
            Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
            & 'build-overrides/apply-v0.4.5.ps1'
            & 'build-overrides/apply-v0.4.6.ps1'
            & 'build-overrides/apply-v0.4.7.ps1'
            & 'build-overrides/apply-v0.4.8b.ps1'
            & 'build-overrides/apply-v0.5.0.ps1'
            "v0.5.0 applied" | Add-Content diagnostics/apply.txt
            "archive chars: $((Get-Content 'build-overrides/v0.5.1.patch.gz.b64' -Raw).Trim().Length)" | Add-Content diagnostics/apply.txt
            & 'build-overrides/apply-v0.5.1.ps1' *>&1 | Tee-Object -FilePath diagnostics/v051-output.txt
            if ($LASTEXITCODE -ne 0) { throw "apply-v0.5.1 exit code $LASTEXITCODE" }
            "v0.5.1 applied" | Add-Content diagnostics/apply.txt
          } catch {
            ($_ | Out-String) | Add-Content diagnostics/apply.txt
            throw
          }

      - name: Parse RAM reader
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'app/tools/ram-reader.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'RAM reader PowerShell parse failed.'
          }
          $main = Get-Content 'app/src/main.tsx' -Raw
          $ram = Get-Content 'app/tools/ram-reader.ps1' -Raw
          if (-not $main.Contains('buildTwilightAchievementStates')) { throw 'State engine UI wiring missing.' }
          if (-not $ram.Contains("gameStateEngine = 'tp-gz2e01-v1'")) { throw 'State engine RAM marker missing.' }
          if ($ram.Contains("'GZ2P01' =") -or $ram.Contains("'GZ2J01' =")) { throw 'Unsupported region remains in RAM reader.' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: TypeScript and Vite build
        working-directory: app
        run: npm run build

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v051-diagnostics
          path: diagnostics/*
          if-no-files-found: warn
