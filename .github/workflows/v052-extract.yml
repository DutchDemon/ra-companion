name: Extract v0.5.1 source

on:
  push:
    branches: [v0.5.2-work]
    paths:
      - '.github/workflows/v052-extract.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.5.1 working source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a') { throw "Unexpected baseline SHA256: $hash" }
          Expand-Archive $zip -DestinationPath app -Force
          Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
          Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
          & 'build-overrides/apply-v0.4.5.ps1'
          & 'build-overrides/apply-v0.4.6.ps1'
          & 'build-overrides/apply-v0.4.7.ps1'
          & 'build-overrides/apply-v0.4.8b.ps1'
          & 'build-overrides/apply-v0.5.0.ps1'
          & 'build-overrides/apply-v0.5.1.ps1'
          $pkg = Get-Content 'app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.5.1') { throw "Expected 0.5.1, got $($pkg.version)" }

      - name: Collect source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path export/src/profiles -Force | Out-Null
          New-Item -ItemType Directory -Path export/tools -Force | Out-Null
          New-Item -ItemType Directory -Path export/electron -Force | Out-Null
          Copy-Item app/src/main.tsx export/src/main.tsx
          Copy-Item app/src/global.d.ts export/src/global.d.ts
          Copy-Item app/src/profiles/twilightPrincess.ts export/src/profiles/twilightPrincess.ts
          Copy-Item app/src/profiles/twilightPrincessState.ts export/src/profiles/twilightPrincessState.ts
          Copy-Item app/src/profiles/twilightPrincessGuide.ts export/src/profiles/twilightPrincessGuide.ts
          Copy-Item app/tools/ram-reader.ps1 export/tools/ram-reader.ps1
          Copy-Item app/package.json export/package.json
          Copy-Item app/package-lock.json export/package-lock.json
          Copy-Item app/electron/main.cjs export/electron/main.cjs
          Copy-Item app/electron/preload.cjs export/electron/preload.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: v051-working-source
          path: export
          if-no-files-found: error
