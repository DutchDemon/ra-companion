name: Wind Waker Test 3.1.1 Quarter Hearts Windows Installer

on:
  push:
    branches: [test/wind-waker-heart-hotfix-installer]
    paths:
      - '.github/workflows/wind-waker-heart-hotfix-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wind-waker-heart-hotfix-installer
  cancel-in-progress: true

env:
  TEST_VERSION: 0.8.2-test.3.1
  SOURCE_MERGE: f1eca4324e7d2944ebd5ffbc258f7da6f1b03f22

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact Test 3 source and safety boundary
        shell: pwsh
        run: |
          node scripts/test-wind-waker-profile.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Wind Waker detection regression failed.' }
          node scripts/test-wind-waker-memory-profile.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Wind Waker Test 3.1 memory regression failed.' }

          function Convert-HexToUInt64([string]$hex) { return [Convert]::ToUInt64($hex, 16) }
          . ./app/tools/memory-profiles/wind-waker-gzlp01.ps1
          $quarterHeartCases = @{
            12 = 3.00
            11 = 2.75
            10 = 2.50
            9 = 2.25
            8 = 2.00
          }
          foreach ($entry in $quarterHeartCases.GetEnumerator()) {
            $actual = Convert-WindWakerLifeUnitsToHearts ([int]$entry.Key)
            if ([Math]::Abs([double]$actual - [double]$entry.Value) -gt 0.001) {
              throw "Unexpected quarter-heart conversion for raw $($entry.Key): $actual"
            }
          }

          $profile = Get-Content 'app/electron/game-profiles/wind-waker.cjs' -Raw
          if (-not $profile.Contains("raGameId: 9190")) { throw 'Wind Waker RA game ID is missing.' }
          if (-not $profile.Contains("'GZLP01'")) { throw 'Wind Waker PAL game code is missing.' }
          if (-not $profile.Contains('enhanced: true')) { throw 'Test 3 RAM profile is not enabled.' }
          if ($profile -match '0x[0-9A-Fa-f]{6,8}') { throw 'Electron profile must remain address-free.' }

          $memoryProfile = Get-Content 'app/tools/memory-profiles/wind-waker-gzlp01.ps1' -Raw
          foreach ($address in @('803CC530', '803D1664', '803FE278')) {
            if (-not $memoryProfile.Contains($address)) { throw "Missing verified GZLP01 address: $address" }
          }
          foreach ($forbiddenWrite in @('WriteProcessMemory', 'FILE_MAP_WRITE', 'PROCESS_VM_WRITE')) {
            if ($memoryProfile.Contains($forbiddenWrite)) { throw "Forbidden memory-write primitive found: $forbiddenWrite" }
          }

          $reader = Get-Content 'app/tools/ram-reader.ps1' -Raw
          if (-not $reader.Contains('FILE_MAP_READ = 0x0004')) { throw 'Dolphin shared-memory provider is not read-only.' }
          if (-not $reader.Contains("'GZLP01' = (Get-WindWakerMemoryProfile)")) { throw 'GZLP01 GameMemoryProfile dispatch is missing.' }

          $main = Get-Content 'app/electron/main.cjs' -Raw
          if (-not $main.Contains('const progress = baseProgress;')) { throw 'Official RA completion authority invariant is missing.' }
          if ($main.Contains('runtimeProgress =')) { throw 'Local runtime must not replace official RA progress.' }

          $runtimeData = Get-Content 'app/electron/services/ra-runtime-data-service.cjs' -Raw
          foreach ($forbidden in @("r: 'startsession'", "r: 'ping'", "r: 'awardachievement'", "r: 'submitlbentry'")) {
            if ($runtimeData.Contains($forbidden)) { throw "Forbidden RA endpoint found: $forbidden" }
          }

      - name: Stamp isolated test version
        shell: pwsh
        run: |
          $path = 'app/package.json'
          $pkg = Get-Content $path -Raw | ConvertFrom-Json
          $pkg.version = $env:TEST_VERSION
          $pkg | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding UTF8
          if ((Get-Content $path -Raw | ConvertFrom-Json).version -ne $env:TEST_VERSION) { throw 'Test version stamp failed.' }

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Validate app
        working-directory: app
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed.' }
          npx vitest run src/__tests__/v082.wind-waker-memory.test.ts --environment jsdom
          if ($LASTEXITCODE -ne 0) { throw 'Wind Waker renderer regression failed.' }
          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed.' }

      - name: Build pinned rcheevos helper
        shell: pwsh
        run: |
          ./scripts/build-runtime-helper.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Runtime helper build failed.' }
          node scripts/test-observer-runtime-integration.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Observer integration failed.' }
          $helper = (Resolve-Path 'app/tools/ra-runtime-helper.exe').Path
          $raw = & $helper --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Runtime helper self-test failed.' }
          $self = $raw | ConvertFrom-Json
          if (-not $self.ok -or -not $self.readOnlyBridge -or $self.rcheevosTag -ne 'v12.5.0') { throw 'Runtime helper safety validation failed.' }

      - name: Build NSIS test installer
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder failed.' }

      - name: Verify packaged test build
        shell: pwsh
        run: |
          $packagedRoot = 'app/release/win-unpacked/resources/app'
          $packagedPackage = Join-Path $packagedRoot 'package.json'
          $packagedMain = Join-Path $packagedRoot 'electron/main.cjs'
          $packagedProfile = Join-Path $packagedRoot 'electron/game-profiles/wind-waker.cjs'
          $packagedReader = Join-Path $packagedRoot 'tools/ram-reader.ps1'
          $packagedMemoryProfile = Join-Path $packagedRoot 'tools/memory-profiles/wind-waker-gzlp01.ps1'
          $packagedHelper = Join-Path $packagedRoot 'tools/ra-runtime-helper.exe'
          foreach ($required in @($packagedPackage, $packagedMain, $packagedProfile, $packagedReader, $packagedMemoryProfile, $packagedHelper)) {
            if (-not (Test-Path $required)) { throw "Missing packaged file: $required" }
          }
          if ((Get-Content $packagedPackage -Raw | ConvertFrom-Json).version -ne $env:TEST_VERSION) { throw 'Packaged test version is wrong.' }

          $profile = Get-Content $packagedProfile -Raw
          if (-not $profile.Contains('raGameId: 9190') -or -not $profile.Contains("'GZLP01'") -or -not $profile.Contains('enhanced: true')) {
            throw 'Packaged Wind Waker Test 3.1 profile is incomplete.'
          }
          $memoryProfile = Get-Content $packagedMemoryProfile -Raw
          if (-not $memoryProfile.Contains('803CC530') -or -not $memoryProfile.Contains('803D1664') -or -not $memoryProfile.Contains('803FE278')) {
            throw 'Packaged verified GZLP01 memory profile is incomplete.'
          }
          $reader = Get-Content $packagedReader -Raw
          if (-not $reader.Contains('FILE_MAP_READ = 0x0004')) { throw 'Packaged memory provider lost read-only invariant.' }

          $main = Get-Content $packagedMain -Raw
          if (-not $main.Contains('const progress = baseProgress;')) { throw 'Packaged RA authority invariant is missing.' }

          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq "RA Companion Setup $env:TEST_VERSION.exe" } | Select-Object -First 1
          if (-not $installer) { throw 'Test installer was not generated.' }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content 'app/release/test-installer-sha256.txt'

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction Stop
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $env:INSTALLER_PATH -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { ($_.Resources -join ';') -like '*RA Companion Setup 0.8.2-test.3.1.exe*' })
            if ($hits.Count -gt 0) { throw 'Microsoft Defender detected the test installer.' }
          }
          'RESULT: NO DETECTION' | Set-Content 'app/release/test-defender-scan.txt'

      - name: Stage test artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'test-artifact' | Out-Null
          Copy-Item $env:INSTALLER_PATH 'test-artifact/'
          Copy-Item 'app/release/test-installer-sha256.txt' 'test-artifact/'
          Copy-Item 'app/release/test-defender-scan.txt' 'test-artifact/'
          @(
            'Wind Waker Test 3.1.1',
            'Build: 0.8.2-test.3.1',
            "Source merge: $env:SOURCE_MERGE",
            'Purpose: verified read-only GZLP01 game code, area/room, quarter-precision hearts and rupees.',
            'Official RA server progress remains authoritative.',
            'Official rcheevos Rich Presence remains preferred.',
            'No Wind Waker inventory, story flags or missable routing are included yet.'
          ) | Set-Content 'test-artifact/README-TEST.txt'

      - name: Upload test installer artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-wind-waker-test3-windows
          if-no-files-found: error
          retention-days: 14
          path: test-artifact/**
