name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-source/**'
      - 'build-overrides/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source baseline
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          if ($parts.Count -lt 1) { throw 'No source chunks found.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'ra-companion-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a'
          if ($actual -ne $expected) { throw "Source SHA256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath app -Force
          "SOURCE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply v0.5.3 source overrides
        shell: pwsh
        run: |
          if (-not (Test-Path 'build-overrides/src')) { throw 'Renderer source overrides directory is missing.' }
          if (-not (Test-Path 'build-overrides/electron')) { throw 'Electron source overrides directory is missing.' }
          Copy-Item 'build-overrides/src/*' 'app/src/' -Recurse -Force
          Copy-Item 'build-overrides/electron/*' 'app/electron/' -Recurse -Force
          & 'build-overrides/apply-v0.4.5.ps1'
          & 'build-overrides/apply-v0.4.6.ps1'
          & 'build-overrides/apply-v0.4.7.ps1'
          & 'build-overrides/apply-v0.4.8b.ps1'
          & 'build-overrides/apply-v0.5.0.ps1'
          & 'build-overrides/apply-v0.5.1.ps1'
          & 'build-overrides/apply-v0.5.2.ps1'
          & 'build-overrides/apply-v0.5.3.ps1'
          if (-not (Test-Path 'app/src/profiles/twilightPrincessGuide.ts')) { throw 'Twilight Princess guide module was not applied.' }
          if (-not (Test-Path 'app/src/profiles/twilightPrincessState.ts')) { throw 'Twilight Princess game-state module was not applied.' }
          if (-not (Test-Path 'app/src/AppPages.tsx')) { throw 'Stable top-level page module was not applied.' }
          $pkg = Get-Content 'app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.5.3') { throw "Expected app version 0.5.3, got $($pkg.version)" }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Sanity checks and regressions
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          if (Select-String -Path 'build/installer.nsh' -Pattern 'isForceCurrentInstall') { throw 'Forced per-user installer mode is not allowed.' }
          if (-not (Select-String -Path 'src/main.tsx' -SimpleMatch 'className="v5-app-shell"' -Quiet)) { throw 'v0.5 app shell is missing.' }
          if (-not (Select-String -Path 'src/main.tsx' -SimpleMatch 'buildTwilightAchievementStates' -Quiet)) { throw 'Full-set Game State Engine UI wiring is missing.' }
          if (-not (Select-String -Path 'src/main.tsx' -SimpleMatch "String(liveRam?.gameCode || '') === 'GZ2E01'" -Quiet)) { throw 'USA-only GZ2E01 detection is missing.' }
          if (-not (Select-String -Path 'src/main.tsx' -SimpleMatch 'deepLiveAchievements' -Quiet)) { throw 'Deep live RAM opportunities are not surfaced.' }
          if (-not (Select-String -Path 'src/main.tsx' -SimpleMatch 'whatMattersAchievements' -Quiet)) { throw 'Deep missables are not promoted into What Matters Now.' }
          if (Select-String -Path 'src/main.tsx' -SimpleMatch 'function SettingsPage(' -Quiet) { throw 'SettingsPage is still nested in App and can lose focus on snapshot refresh.' }
          if (Select-String -Path 'src/main.tsx' -SimpleMatch 'function Dashboard(' -Quiet) { throw 'Dashboard is still nested in App.' }
          if (-not (Select-String -Path 'src/AppPages.tsx' -SimpleMatch 'export function SettingsPage()' -Quiet)) { throw 'Top-level SettingsPage is missing.' }
          if (-not (Select-String -Path 'src/AppPages.tsx' -SimpleMatch 'RA Companion v{version}' -Quiet)) { throw 'Dynamic update-card version rendering is missing.' }
          if (Select-String -Path 'src/AppPages.tsx' -Pattern 'RA Companion v0\.5\.[0-9]+' -Quiet) { throw 'Hardcoded app version remains in renderer page UI.' }
          if (-not (Select-String -Path 'src/profiles/twilightPrincessState.ts' -SimpleMatch "id === '449436'" -Quiet)) { throw 'Pump up the King achievement-ID rule is missing.' }
          if (-not (Select-String -Path 'src/profiles/twilightPrincessState.ts' -SimpleMatch 'bottleSlotPresent' -Quiet)) { throw 'Filled-bottle ownership fallback is missing.' }
          if (-not (Select-String -Path 'src/profiles/twilightPrincessGuide.ts' -SimpleMatch "'pump up the king': guide(" -Quiet)) { throw 'Pump up the King guide mapping is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch "ipcMain.handle('app:version', () => app.getVersion())" -Quiet)) { throw 'Dynamic app-version IPC is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'registerShortcutBinding' -Quiet)) { throw 'Verified shortcut registration is missing.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'app.requestSingleInstanceLock()' -Quiet)) { throw 'Single-instance shortcut protection is missing.' }
          if (-not (Select-String -Path 'electron/preload.cjs' -SimpleMatch 'getAppVersion' -Quiet)) { throw 'App-version preload API is missing.' }
          if (-not (Select-String -Path 'electron/preload.cjs' -SimpleMatch 'getShortcutState' -Quiet)) { throw 'Shortcut status preload API is missing.' }
          if (-not (Select-String -Path 'src/styles.css' -SimpleMatch 'v5-account-connection' -Quiet)) { throw 'Settings interaction CSS is missing.' }
          if (-not (Test-Path 'src/__tests__/v053.regression.test.tsx')) { throw 'v0.5.3 regression tests are missing.' }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/ram-reader.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'RAM reader PowerShell parse failed.' }
          if (-not (Select-String -Path 'electron/main.cjs' -SimpleMatch 'quitAndInstall(true, true)' -Quiet)) { throw 'Silent updater install call is missing.' }
          if (Select-String -Path 'electron/main.cjs' -SimpleMatch 'quitAndInstall(false, true)' -Quiet) { throw 'Interactive updater install call is still present.' }
          npm run test:regressions
          npm run build

      - name: Build NSIS installer
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Locate installer and generate hashes
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq 'RA Companion Setup 0.5.3.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha512 = (Get-FileHash $installer.FullName -Algorithm SHA512).Hash.ToLowerInvariant()
          @(
            "File: $($installer.Name)",
            "Source baseline SHA256: $env:SOURCE_SHA256",
            "Installer SHA256: $sha256",
            "Installer SHA512: $sha512"
          ) | Set-Content 'app/release/checksums.txt'
          Get-Content 'app/release/checksums.txt'

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $report = 'app/release/defender-scan.txt'
          "Target: $env:INSTALLER_PATH" | Set-Content $report
          $status = Get-MpComputerStatus -ErrorAction Stop
          "AntivirusEnabled: $($status.AntivirusEnabled)" | Add-Content $report
          "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)" | Add-Content $report
          "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)" | Add-Content $report
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $env:INSTALLER_PATH -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { ($_.Resources -join ';') -like "*$($env:INSTALLER_NAME)*" })
            if ($hits.Count -gt 0) {
              "RESULT: DETECTION" | Add-Content $report
              $hits | Format-List * | Out-String | Add-Content $report
              Get-Content $report
              throw 'Microsoft Defender detected the installer.'
            }
            "RESULT: NO DETECTION" | Add-Content $report
          } else {
            "RESULT: DEFENDER NOT ENABLED ON RUNNER" | Add-Content $report
          }
          Get-Content $report

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.5.3-windows
          if-no-files-found: error
          path: |
            app/release/RA Companion Setup 0.5.3.exe
            app/release/*.blockmap
            app/release/latest.yml
            app/release/checksums.txt
            app/release/defender-scan.txt

  clamav:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.5.3-windows
          path: artifact

      - name: Install and update ClamAV
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo pkill -x freshclam || true
          sudo freshclam
          clamscan --version
          test -n "$(find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print -quit)"

      - name: ClamAV scan
        shell: bash
        run: |
          set -o pipefail
          INSTALLER=$(find artifact -maxdepth 1 -type f -name 'RA Companion Setup 0.5.3.exe' -print -quit)
          test -n "$INSTALLER"
          clamscan "$INSTALLER" | tee artifact/clamav-scan.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload antivirus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.5.3-antivirus
          path: artifact/clamav-scan.txt
          if-no-files-found: warn

  release:
    needs: [build, clamav]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.5.3-windows
          path: release

      - name: Download ClamAV report
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.5.3-antivirus
          path: antivirus

      - name: Prepare and verify updater payload
        shell: bash
        run: |
          test -f 'release/RA Companion Setup 0.5.3.exe'
          test -f 'release/RA Companion Setup 0.5.3.exe.blockmap'
          test -f 'release/latest.yml'
          test -f 'release/checksums.txt'
          test -f 'release/defender-scan.txt'
          test -f 'antivirus/clamav-scan.txt'

          cp 'release/RA Companion Setup 0.5.3.exe' 'release/RA-Companion-Setup-0.5.3.exe'
          cp 'release/RA Companion Setup 0.5.3.exe.blockmap' 'release/RA-Companion-Setup-0.5.3.exe.blockmap'

          EXPECTED_PATH=$(awk '/^path:/ {print $2; exit}' release/latest.yml)
          test "$EXPECTED_PATH" = 'RA-Companion-Setup-0.5.3.exe'
          test -f "release/$EXPECTED_PATH"
          test -f "release/$EXPECTED_PATH.blockmap"

      - name: Publish GitHub Release v0.5.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## RA Companion v0.5.3 — Runtime Reliability Fixes

          - Fixes Settings → Account Connection losing keyboard focus every live refresh. Page components now have stable React identities instead of being recreated inside the 700 ms snapshot render loop.
          - Adds a regression test that focuses the Username field, forces repeated parent refresh renders and verifies the same input keeps focus.
          - Removes hardcoded version labels from the desktop UI. The sidebar and Updates card now read the real packaged version from Electron (`app.getVersion()`).
          - Hardens **Pump up the King!** using its RA achievement ID (449436), a dedicated guide mapping and direct bottle-slot fallback, so filled bottles count even if an aggregate bottle counter is stale.
          - Promotes deep RAM-backed missables into **What Matters Now** and Current Game, so an achievement proven available by RAM is not discarded just because the older context/guide bucket missed it.
          - Reduces unrelated challenge-run noise: a 3-heart challenge that is merely still eligible stays tracked instead of being treated as actively in progress everywhere.
          - Preserves the verified global-hotkey registration/fallback and single-instance protections introduced in v0.5.2.

          The Windows installer was compiled after the focus/Pump regression suite passed, then scanned successfully by Microsoft Defender and ClamAV in CI before publication.
          NOTES

          TAG='v0.5.3'
          REPO='${{ github.repository }}'

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              'release/RA-Companion-Setup-0.5.3.exe' \
              'release/RA-Companion-Setup-0.5.3.exe.blockmap' \
              'release/latest.yml' \
              'release/checksums.txt' \
              'release/defender-scan.txt' \
              'antivirus/clamav-scan.txt' \
              --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title 'RA Companion v0.5.3' --notes-file release-notes.md --latest
          else
            gh release create "$TAG" \
              'release/RA-Companion-Setup-0.5.3.exe' \
              'release/RA-Companion-Setup-0.5.3.exe.blockmap' \
              'release/latest.yml' \
              'release/checksums.txt' \
              'release/defender-scan.txt' \
              'antivirus/clamav-scan.txt' \
              --repo "$REPO" \
              --target main \
              --title 'RA Companion v0.5.3' \
              --notes-file release-notes.md \
              --latest
          fi
