name: Apply TP Full Story Route Patch

on:
  push:
    branches: [feature/tp-full-story-route]
    paths:
      - '.github/workflows/tp-full-story-route-patch.yml'
      - 'scripts/apply-tp-full-story-route-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tp-full-story-route
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply story-route patch
        run: python scripts/apply-tp-full-story-route-patch.py
      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-tp-full-story-route-patch.py
          rm -f .github/workflows/tp-full-story-route-patch.yml
      - name: Verify intended diff only
        run: |
          git diff --check
          git status --short
      - name: Commit patched product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/profiles/twilightPrincess.ts app/src/profiles/registry.ts app/src/main.tsx scripts/apply-tp-full-story-route-patch.py .github/workflows/tp-full-story-route-patch.yml
          git commit -m 'feat: make Twilight Princess overlay story-route aware'
          git push origin HEAD:feature/tp-full-story-route
