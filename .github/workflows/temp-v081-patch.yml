name: Apply v0.8.1 Compact Login Patch

on:
  push:
    branches:
      - feature/v0.8.1-settings-epipe-story-next
    paths:
      - '.github/workflows/temp-v081-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.8.1-settings-epipe-story-next
      - name: Apply product patch
        run: python scripts/patch-v081.py
      - name: Sanity-check patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Save & connect' app/src/AppPages.tsx
          grep -Fq "spawned.stdin.on('error'" app/electron/services/runtime-helper-service.cjs
          grep -Fq 'achievements={nextStoryAchievements}' app/src/main.tsx
          node --check app/electron/services/runtime-helper-service.cjs
          node scripts/test-runtime-helper-epipe.cjs
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main.tsx app/src/AppPages.tsx app/src/styles.css app/electron/services/runtime-helper-service.cjs app/src/__tests__/v070.runtime-auth-data.test.ts app/src/__tests__/v072.ra-setup-faron.test.ts app/src/__tests__/v081.settings-epipe-story-next.test.ts scripts/test-runtime-helper-epipe.cjs
          git commit -m 'feat: compact RA login and harden runtime pipe handling'
          git push origin HEAD:feature/v0.8.1-settings-epipe-story-next
