name: v0.7 rcheevos Runtime Helper

on:
  workflow_dispatch:
  push:
    branches: [feature/v0.7.0-rcheevos-runtime-helper]
    paths:
      - 'native/rcheevos-runtime-helper/**'
      - 'scripts/build-runtime-helper.ps1'
      - 'scripts/refactor-v070-runtime-helper.cjs'
      - 'app/electron/**'
      - 'app/src/**'
      - '.github/workflows/v070-rcheevos-helper.yml'

permissions:
  contents: write

concurrency:
  group: v070-rcheevos-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Apply deterministic Electron runtime-helper integration
        shell: pwsh
        run: |
          node scripts/refactor-v070-runtime-helper.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime-helper integration migration failed.' }

      - name: Build pinned rcheevos runtime helper
        shell: pwsh
        run: |
          ./scripts/build-runtime-helper.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Runtime helper build failed.' }

      - name: Exercise JSON-line helper protocol
        shell: pwsh
        run: |
          $helper = (Resolve-Path 'app/tools/ra-runtime-helper.exe').Path
          $lines = @(
            '{"id":1,"command":"ping"}',
            '{"id":2,"command":"status"}',
            '{"id":3,"command":"reset"}',
            '{"id":4,"command":"shutdown"}'
          ) | & $helper
          if ($LASTEXITCODE -ne 0) { throw "Runtime helper protocol smoke test failed with exit code $LASTEXITCODE." }
          $lines | Set-Content 'runtime-helper-protocol.txt'
          $messages = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          $ready = $messages | Where-Object { $_.type -eq 'ready' } | Select-Object -First 1
          if (-not $ready -or -not $ready.runtimeInitialized) { throw 'Runtime helper did not emit a healthy ready message.' }
          if ($ready.rcheevosTag -ne 'v12.5.0') { throw "Unexpected helper rcheevos tag: $($ready.rcheevosTag)" }
          foreach ($command in @('ping', 'status', 'reset', 'shutdown')) {
            $response = $messages | Where-Object { $_.type -eq 'response' -and $_.command -eq $command } | Select-Object -First 1
            if (-not $response -or -not $response.ok) { throw "Runtime helper command failed: $command" }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Strict syntax, regression and production checks
        working-directory: app
        shell: pwsh
        run: |
          node --check electron/main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'electron/main.cjs syntax check failed.' }
          node --check electron/services/runtime-helper-service.cjs
          if ($LASTEXITCODE -ne 0) { throw 'runtime-helper-service syntax check failed.' }
          node --check electron/game-profiles/registry.cjs
          if ($LASTEXITCODE -ne 0) { throw 'game-profile registry syntax check failed.' }
          node --check electron/ipc/register.cjs
          if ($LASTEXITCODE -ne 0) { throw 'IPC registration syntax check failed.' }

          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Production build failed with exit code $LASTEXITCODE." }

      - name: Build NSIS installer with runtime helper
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE." }

      - name: Verify packaged helper and Defender scan
        shell: pwsh
        run: |
          $packagedHelper = 'app/release/win-unpacked/resources/app/tools/ra-runtime-helper.exe'
          if (-not (Test-Path $packagedHelper)) { throw 'Packaged RA Companion is missing ra-runtime-helper.exe.' }
          $selfTestOutput = & $packagedHelper --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime helper self-test failed.' }
          $selfTest = $selfTestOutput | ConvertFrom-Json
          if (-not $selfTest.ok -or $selfTest.rcheevosTag -ne 'v12.5.0') { throw 'Packaged runtime helper reported an invalid self-test.' }

          $notice = 'app/release/win-unpacked/resources/app/tools/rcheevos-THIRD-PARTY-NOTICES.md'
          if (-not (Test-Path $notice)) { throw 'Packaged app is missing the rcheevos third-party notice.' }

          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq 'RA Companion Setup 0.6.4.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }

          $report = 'app/release/defender-scan.txt'
          "Installer: $($installer.FullName)" | Set-Content $report
          "Helper: $((Resolve-Path $packagedHelper).Path)" | Add-Content $report
          $status = Get-MpComputerStatus -ErrorAction Stop
          "AntivirusEnabled: $($status.AntivirusEnabled)" | Add-Content $report
          "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)" | Add-Content $report
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $packagedHelper).Path -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              ($_.Resources -join ';') -like "*$($installer.Name)*" -or ($_.Resources -join ';') -like '*ra-runtime-helper.exe*'
            })
            if ($hits.Count -gt 0) { throw 'Microsoft Defender detected a runtime-helper validation artifact.' }
          }
          "RESULT: NO DETECTION" | Add-Content $report

      - name: Upload validation build
        uses: actions/upload-artifact@v4
        with:
          name: v070-rcheevos-runtime-helper-validation
          if-no-files-found: error
          path: |
            app/release/RA Companion Setup 0.6.4.exe
            app/release/RA Companion Setup 0.6.4.exe.blockmap
            app/release/latest.yml
            app/release/defender-scan.txt
            app/tools/ra-runtime-helper.exe
            app/tools/rcheevos-THIRD-PARTY-NOTICES.md
            runtime-helper-protocol.txt

  clamav:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v070-rcheevos-runtime-helper-validation
          path: artifact
      - name: ClamAV scan
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo pkill -x freshclam || true
          sudo freshclam
          INSTALLER=$(find artifact -type f -name 'RA Companion Setup 0.6.4.exe' -print -quit)
          HELPER=$(find artifact -type f -name 'ra-runtime-helper.exe' -print -quit)
          test -n "$INSTALLER"
          test -n "$HELPER"
          clamscan "$INSTALLER" "$HELPER" | tee artifact/clamav-scan.txt
          test ${PIPESTATUS[0]} -eq 0

  promote:
    needs: [build, clamav]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-rcheevos-runtime-helper
          fetch-depth: 0
      - name: Commit validated Electron runtime-helper integration
        shell: bash
        run: |
          node scripts/refactor-v070-runtime-helper.cjs
          if git diff --quiet -- app/electron/main.cjs app/electron/ipc/register.cjs app/electron/preload.cjs app/src/global.d.ts; then
            echo 'Canonical source already contains the validated runtime-helper integration.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/electron/main.cjs app/electron/ipc/register.cjs app/electron/preload.cjs app/src/global.d.ts
          git commit -m 'feat: integrate native rcheevos runtime helper'
          git push origin HEAD:feature/v0.7.0-rcheevos-runtime-helper
