name: Bootstrap RA Companion source overrides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-twilight-profile.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.4.4 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.b64' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'ra-companion-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '890c9a743a93c7679ece46d858a22f7c59e96d93873135a0340ae1fbe78ef99a'
          if ($actual -ne $expected) { throw "Source SHA256 mismatch: $actual" }
          Expand-Archive $zip -DestinationPath app -Force
          if (-not (Test-Path 'app/src')) { throw 'Source directory not found.' }

      - name: Publish source baseline as build overrides
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-overrides/src' | Out-Null
          Copy-Item 'app/src/*' 'build-overrides/src/' -Recurse -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-overrides/src
          if (git diff --cached --quiet) {
            Write-Host 'Source overrides already match the v0.4.4 baseline.'
            exit 0
          }
          git commit -m 'Extract v0.4.4 renderer source overrides'
          git push
