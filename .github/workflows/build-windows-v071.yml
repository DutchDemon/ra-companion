name: Build and Release Windows v0.7.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v0.7.1
    paths:
      - 'app/package.json'
      - 'app/src/**'
      - 'app/electron/**'
      - 'native/rcheevos-runtime-helper/**'
      - 'scripts/**'
      - '.github/workflows/build-windows-v071.yml'

permissions:
  contents: write

concurrency:
  group: windows-release-v071-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.7.1
  RELEASE_TAG: v0.7.1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify v0.7.1 source and authority boundary
        shell: pwsh
        run: |
          $pkg = Get-Content 'app/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne $env:RELEASE_VERSION) { throw "Expected app version $env:RELEASE_VERSION, got $($pkg.version)" }
          if ($pkg.build.win.icon -ne 'electron/ra-icon.ico') { throw 'Windows icon config is missing.' }
          if (-not (Test-Path 'app/electron/ra-icon.ico')) { throw 'Windows ICO asset is missing.' }

          node --check app/electron/main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Electron main syntax check failed.' }
          node --check app/electron/preload.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Electron preload syntax check failed.' }
          node --check app/electron/services/observer-runtime-service.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Observer runtime syntax check failed.' }
          node --check app/electron/services/ra-runtime-data-service.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime data service syntax check failed.' }

          $main = Get-Content 'app/electron/main.cjs' -Raw
          if (-not $main.Contains('const progress = baseProgress;')) { throw 'Official RA completion authority invariant is missing.' }
          if ($main.Contains('runtimeProgress =')) { throw 'Local runtime must not replace official RA progress.' }
          if (-not $main.Contains("source: 'rcheevos-runtime'")) { throw 'Official local rcheevos Rich Presence source is missing.' }

          $runtimeData = Get-Content 'app/electron/services/ra-runtime-data-service.cjs' -Raw
          foreach ($forbidden in @("r: 'startsession'", "r: 'ping'", "r: 'awardachievement'", "r: 'submitlbentry'")) {
            if ($runtimeData.Contains($forbidden)) { throw "Forbidden RA submission/session endpoint found: $forbidden" }
          }

          $renderer = Get-Content 'app/src/main.tsx' -Raw
          $pages = Get-Content 'app/src/AppPages.tsx' -Raw
          if ($renderer.Contains('v6-overlay-live-stats')) { throw 'Removed live-stat strip is still rendered.' }
          if ($renderer.Contains('v7-overlay-live-counters')) { throw 'Removed overlay live-progress panel is still rendered.' }
          if ($pages.Contains('LIVE ACHIEVEMENT PROGRESS')) { throw 'Removed dashboard/current-game live-progress panel is still rendered.' }
          if (-not $renderer.Contains('findPendingFaronVesselObjective')) { throw 'Faron Vessel next-step fallback is missing.' }
          if (-not $renderer.Contains('achievementCounter(achievement, ram, profile || null, runtimeLive) || state?.progress')) { throw 'Inline achievement counter fallback is missing.' }

          node scripts/test-live-achievement-counters.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Live achievement counter contract failed.' }

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Typecheck regressions and production build
        working-directory: app
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript typecheck failed.' }
          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed.' }

      - name: Build pinned rcheevos helper
        shell: pwsh
        run: |
          ./scripts/build-runtime-helper.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Runtime helper build failed.' }

      - name: Validate native observer path
        shell: pwsh
        run: |
          node scripts/test-observer-runtime-integration.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Observer/native integration failed.' }

          $helper = (Resolve-Path 'app/tools/ra-runtime-helper.exe').Path
          $raw = & $helper --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Runtime helper self-test failed.' }
          $self = $raw | ConvertFrom-Json
          if (-not $self.ok -or -not $self.runtimeParser -or -not $self.gameCubeMemoryMapping -or -not $self.observerRuntime -or -not $self.richPresenceRuntime -or -not $self.readOnlyBridge) {
            throw 'Runtime helper observer/read-only self-test failed.'
          }
          if ($self.rcheevosTag -ne 'v12.5.0') { throw "Unexpected rcheevos tag: $($self.rcheevosTag)" }
          $raw | Set-Content 'app/release-helper-self-test.txt'

      - name: Build NSIS installer
        working-directory: app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder failed.' }

      - name: Verify packaged v0.7.1 and generate checksums
        shell: pwsh
        run: |
          $packagedRoot = 'app/release/win-unpacked/resources/app'
          $packagedMain = Join-Path $packagedRoot 'electron/main.cjs'
          $packagedRuntimeData = Join-Path $packagedRoot 'electron/services/ra-runtime-data-service.cjs'
          $packagedHelper = Join-Path $packagedRoot 'tools/ra-runtime-helper.exe'
          $packagedDist = Join-Path $packagedRoot 'dist'
          foreach ($required in @($packagedMain, $packagedRuntimeData, $packagedHelper, $packagedDist)) {
            if (-not (Test-Path $required)) { throw "Packaged app is missing release file: $required" }
          }

          $main = Get-Content $packagedMain -Raw
          if (-not $main.Contains('const progress = baseProgress;')) { throw 'Packaged completion-authority invariant is missing.' }
          if (-not $main.Contains("source: 'rcheevos-runtime'")) { throw 'Packaged official Rich Presence source is missing.' }

          $runtimeData = Get-Content $packagedRuntimeData -Raw
          foreach ($forbidden in @("r: 'startsession'", "r: 'ping'", "r: 'awardachievement'", "r: 'submitlbentry'")) {
            if ($runtimeData.Contains($forbidden)) { throw "Packaged runtime contains forbidden endpoint: $forbidden" }
          }

          $rendererText = (Get-ChildItem $packagedDist -Recurse -File -Filter '*.js' | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if (-not $rendererText.Contains('RA RICH PRESENCE')) { throw 'Packaged renderer is missing official Rich Presence.' }
          if ($rendererText.Contains('LIVE ACHIEVEMENT PROGRESS')) { throw 'Packaged renderer still contains removed live-progress panel.' }
          if ($rendererText.Contains('v6-overlay-live-stats')) { throw 'Packaged renderer still contains removed stat strip.' }
          if (-not $rendererText.Contains('Obtain the Vessel of Light')) { throw 'Packaged renderer is missing Faron Vessel next-step text.' }

          $raw = & $packagedHelper --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged helper self-test failed.' }
          $self = $raw | ConvertFrom-Json
          if (-not $self.ok -or -not $self.observerRuntime -or -not $self.richPresenceRuntime -or -not $self.readOnlyBridge) { throw 'Packaged helper capability validation failed.' }
          if ($self.rcheevosTag -ne 'v12.5.0') { throw "Unexpected packaged rcheevos tag: $($self.rcheevosTag)" }

          $expectedInstallerName = "RA Companion Setup $env:RELEASE_VERSION.exe"
          $installer = Get-ChildItem 'app/release/*.exe' | Where-Object { $_.Name -eq $expectedInstallerName } | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated: $expectedInstallerName" }
          if (-not (Test-Path 'app/release/latest.yml')) { throw 'latest.yml was not generated.' }
          if (-not (Test-Path "$($installer.FullName).blockmap")) { throw 'Installer blockmap was not generated.' }

          $latest = Get-Content 'app/release/latest.yml' -Raw
          if (-not $latest.Contains("version: $env:RELEASE_VERSION")) { throw 'latest.yml version is incorrect.' }

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append

          $installerSha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSha512 = (Get-FileHash $installer.FullName -Algorithm SHA512).Hash.ToLowerInvariant()
          $helperSha256 = (Get-FileHash (Resolve-Path $packagedHelper).Path -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "Release: v$env:RELEASE_VERSION",
            "Commit: $env:GITHUB_SHA",
            "Installer: $($installer.Name)",
            "Installer SHA256: $installerSha256",
            "Installer SHA512: $installerSha512",
            "Runtime helper SHA256: $helperSha256",
            "rcheevos: v12.5.0"
          ) | Set-Content 'app/release/checksums.txt'

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $packagedHelper = (Resolve-Path 'app/release/win-unpacked/resources/app/tools/ra-runtime-helper.exe').Path
          $report = 'app/release/defender-scan.txt'
          "Installer: $env:INSTALLER_PATH" | Set-Content $report
          "Helper: $packagedHelper" | Add-Content $report
          $status = Get-MpComputerStatus -ErrorAction Stop
          "AntivirusEnabled: $($status.AntivirusEnabled)" | Add-Content $report
          "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)" | Add-Content $report
          if ($status.AntivirusEnabled) {
            Start-MpScan -ScanType CustomScan -ScanPath $env:INSTALLER_PATH -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath $packagedHelper -ErrorAction Stop
            Start-Sleep -Seconds 2
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              ($_.Resources -join ';') -like "*$($env:INSTALLER_NAME)*" -or ($_.Resources -join ';') -like '*ra-runtime-helper.exe*'
            })
            if ($hits.Count -gt 0) {
              'RESULT: DETECTION' | Add-Content $report
              $hits | Format-List * | Out-String | Add-Content $report
              throw 'Microsoft Defender detected a release artifact.'
            }
          }
          'RESULT: NO DETECTION' | Add-Content $report
          Get-Content $report

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.7.1-windows
          if-no-files-found: error
          path: |
            app/release/RA Companion Setup 0.7.1.exe
            app/release/RA Companion Setup 0.7.1.exe.blockmap
            app/release/latest.yml
            app/release/checksums.txt
            app/release/defender-scan.txt
            app/release-helper-self-test.txt
            app/release/win-unpacked/resources/app/tools/ra-runtime-helper.exe

  clamav:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.7.1-windows
          path: artifact

      - name: Install and update ClamAV
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo pkill -x freshclam || true
          sudo freshclam
          clamscan --version
          test -n "$(find /var/lib/clamav -maxdepth 1 -type f \( -name '*.cvd' -o -name '*.cld' \) -print -quit)"

      - name: ClamAV scan
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER=$(find artifact -type f -name 'RA Companion Setup 0.7.1.exe' -print -quit)
          HELPER=$(find artifact -type f -name 'ra-runtime-helper.exe' -print -quit)
          test -n "$INSTALLER"
          test -n "$HELPER"
          set +e
          clamscan --infected --no-summary "$INSTALLER" "$HELPER" | tee artifact/clamav-scan.txt
          rc=${PIPESTATUS[0]}
          set -e
          test $rc -eq 0

      - name: Upload ClamAV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ra-companion-v0.7.1-antivirus
          path: artifact/clamav-scan.txt
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, clamav]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.7.1-windows
          path: release

      - name: Download ClamAV report
        uses: actions/download-artifact@v4
        with:
          name: ra-companion-v0.7.1-antivirus
          path: antivirus

      - name: Verify and prepare updater payload
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER='release/RA Companion Setup 0.7.1.exe'
          BLOCKMAP='release/RA Companion Setup 0.7.1.exe.blockmap'
          LATEST='release/latest.yml'
          test -f "$INSTALLER"
          test -f "$BLOCKMAP"
          test -f "$LATEST"
          test -f 'release/checksums.txt'
          test -f 'release/defender-scan.txt'
          test -f 'release/release-helper-self-test.txt'
          test -f 'antivirus/clamav-scan.txt'
          grep -q '^version: 0.7.1$' "$LATEST"
          grep -q 'RESULT: NO DETECTION' 'release/defender-scan.txt'

          EXPECTED_PATH=$(awk '/^path:/ {print $2; exit}' "$LATEST" | tr -d '\r')
          test -n "$EXPECTED_PATH"
          EXPECTED_SHA512=$(awk '/^sha512:/ {print $2; exit}' "$LATEST" | tr -d '\r')
          ACTUAL_SHA512=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 -w0)
          test "$ACTUAL_SHA512" = "$EXPECTED_SHA512"

          cp "$INSTALLER" "release/$EXPECTED_PATH"
          cp "$BLOCKMAP" "release/$EXPECTED_PATH.blockmap"
          test -f "release/$EXPECTED_PATH"
          test -f "release/$EXPECTED_PATH.blockmap"
          echo "UPDATER_INSTALLER=$EXPECTED_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release v0.7.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace a live release."
            exit 1
          fi

          cat > release-notes.md <<'NOTES'
          ## RA Companion v0.7.1 — UI & Faron Context Fix

          This patch cleans up duplicated live information and fixes the early Faron Twilight next-step guidance.

          - Removes the redundant hearts / Poe Souls / Golden Bugs / Link-form strip from the overlay.
          - Removes the separate Live Achievement Progress panels from the overlay, Dashboard and Current Game.
          - Keeps official rcheevos measured progress available directly on relevant achievement rows as X/Y counters.
          - When Faron Twilight has started but the Vessel of Light is still missing, the companion now surfaces **You Unlock This Door with the Key of Imagination** as the next story beat.
          - Shows **Coming soon · Obtain the Vessel of Light** for that prerequisite instead of falling back to a generic context message.

          ### Integrity and safety
          RetroAchievements remains authoritative for Completed/Locked state. The local runtime stays display/observer-only, Dolphin memory access remains read-only, and RA Companion does not submit gameplay sessions, pings, achievement unlocks or leaderboard entries.

          The Windows release was validated with the full app regression suite, production build, pinned rcheevos helper checks, Microsoft Defender and ClamAV.
          NOTES

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'RA Companion v0.7.1' \
            --notes-file release-notes.md \
            --latest \
            "release/$UPDATER_INSTALLER" \
            "release/$UPDATER_INSTALLER.blockmap" \
            'release/latest.yml' \
            'release/checksums.txt' \
            'release/defender-scan.txt' \
            'antivirus/clamav-scan.txt' \
            'release/release-helper-self-test.txt'

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,assets
