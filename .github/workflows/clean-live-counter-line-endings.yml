name: Clean Live Counter Line Endings

on:
  push:
    branches: [feature/v0.7.0-live-achievement-counters]
    paths:
      - '.github/workflows/clean-live-counter-line-endings.yml'
      - 'scripts/clean-live-counter-line-endings.py'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-live-achievement-counters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original line endings and apply exact changes
        shell: bash
        run: |
          git checkout origin/main -- app/src/profiles/twilightPrincessState.ts app/src/styles.css
          python scripts/clean-live-counter-line-endings.py
      - name: Commit clean product diff
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.whitespace cr-at-eol
          git diff --check
          git add app/src/profiles/twilightPrincessState.ts app/src/styles.css
          git add -u .github/workflows/clean-live-counter-line-endings.yml scripts/clean-live-counter-line-endings.py
          git diff --cached --check
          git commit -m 'chore: preserve source line endings in live counter diff'
          git push origin HEAD:feature/v0.7.0-live-achievement-counters
